name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k $KEYCHAIN_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set up API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Archive
        run: >
          xcodebuild archive
          -scheme Beans
          -destination 'platform=macOS'
          -archivePath $RUNNER_TEMP/Beans.xcarchive
          -skipMacroValidation
          -allowProvisioningUpdates
          -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          -authenticationKeyID $APP_STORE_CONNECT_KEY_ID
          -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
          | xcbeautify --is-ci

      - name: Export and notarize
        run: >
          xcodebuild -exportArchive
          -archivePath $RUNNER_TEMP/Beans.xcarchive
          -exportOptionsPlist ExportOptions.plist
          -exportPath $RUNNER_TEMP/export
          -allowProvisioningUpdates
          -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          -authenticationKeyID $APP_STORE_CONNECT_KEY_ID
          -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
          | xcbeautify --is-ci

      - name: Create zip
        run: |
          cd $RUNNER_TEMP/export
          zip -r $RUNNER_TEMP/Beans-${{ inputs.version }}.zip Beans.app

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create v${{ inputs.version }}
          $RUNNER_TEMP/Beans-${{ inputs.version }}.zip
          --title "Beans v${{ inputs.version }}"
          --generate-notes
